# CodeQL for Komet (codeql.yml): the security and quality suites, less the rules that contradict how Komet is written on purpose.
# Every exclusion says why; whatever else CodeQL finds is fixed in the code.
queries:
  - uses: security-extended
  - uses: security-and-quality

query-filters:
  # [UnsafeAccessor] methods are declared `static extern`, but the JIT implements them as plain field and method access into the
  # engine. The only native calls are four OS statistics (gettid, setpriority, GlobalMemoryStatusEx, GetSystemTimes).
  - exclude:
      id: cs/unmanaged-code
  - exclude:
      id: cs/call-to-unmanaged-code
  # A foreach over a collection expression targets a stack span, `(ReadOnlySpan<T>)[...]`, because Komet.Rules (KR0005) allows
  # foreach only over Bounded(...) or a collection expression; a truly redundant cast fails the build already (IDE0004)
  - exclude:
      id: cs/useless-cast-to-self
  # The fields it names are [InlineArray]s written element by element; the build's IDE0044 knows the difference
  - exclude:
      id: cs/missed-readonly-modifier
  # foreach iterates Contracts.Bounded(...) (KR0005): a Where or Select in front of it would move or drop the bound, and a filter
  # that binds pattern variables for the body reads better as an if
  - exclude:
      id: cs/linq/missed-where
  - exclude:
      id: cs/linq/missed-select
  # Harmony hands a patch the engine's fields as `ref ___name`; the tessellation returns its results by ref on the hot path
  - exclude:
      id: cs/too-many-ref-parameters
  # The tessellation's face predicates are the engine's own conditions term for term, to be checked against it line by line
  - exclude:
      id: cs/complex-condition
  # Thread boundaries catch everything: an exception that escapes a worker ends the game (as CA1031 in .editorconfig)
  - exclude:
      id: cs/catch-of-all-exceptions
  # Its only hit is the Regex source generator's output; Komet's own nesting is checked by the build (S1066)
  - exclude:
      id: cs/nested-if-statements
