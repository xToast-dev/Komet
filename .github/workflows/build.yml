name: build

# Gate: build.sh (JSON check, Komet.Rules, warnings as errors, package). Tests need a game install and run locally only.
on:
  push:
    branches: [main, nightly]
  pull_request:
  workflow_dispatch:

# Never cancel on main: a cancelled release job could leave v<version> tagged without its release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Game assemblies to compile against (see .github/vintagestory/README.md)
      VsInstall: ${{ github.workspace }}/.github/vintagestory
      # Stamped into the assembly: the HUD shows "Preview" and the commit for non-release builds
      KometChannel: ${{ github.ref == 'refs/heads/main' && 'release' || 'preview' }}

    steps:
      - uses: actions/checkout@v7

      # SDK version comes from global.json
      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: Stamp the commit and the build time
        run: |
          echo "KometCommit=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "KometBuilt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Check the game assemblies
        working-directory: .github/vintagestory
        run: sha256sum --check --strict SHA256SUMS

      - name: Build, check and pack
        run: ./build.sh

      - name: Report checksums
        run: |
          cd Releases
          sha256sum komet_*.zip > komet.sha256
          {
            echo '### sha256'
            echo
            echo '```'
            cat komet.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat komet.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: komet
          path: |
            Releases/komet_*.zip
            Releases/komet.sha256
          if-no-files-found: error

  # main -> draft release v<version> (tags are never moved); other branches -> prerelease preview-<sha>; PRs publish nothing.
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v8
        with:
          name: komet
          path: dist

      - name: Work out what this is
        id: what
        run: |
          version=$(jq -r '.version // empty' Komet/modinfo.json)
          [[ -n "$version" ]] || { echo "no version in Komet/modinfo.json"; exit 1; }
          sha=$(git rev-parse --short=7 HEAD)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha"         >> "$GITHUB_OUTPUT"

          if [[ '${{ github.ref }}' == 'refs/heads/main' ]]; then
            echo "preview=false"                >> "$GITHUB_OUTPUT"
            echo "tag=v$version"                >> "$GITHUB_OUTPUT"
            echo "name=Komet $version"          >> "$GITHUB_OUTPUT"
            echo "draft=true"                   >> "$GITHUB_OUTPUT"
            # 2.0.0-pre.2 is not a release; anything without a dash is
            [[ "$version" == *-* ]] && echo "prerelease=true"  >> "$GITHUB_OUTPUT" \
                                    || echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "preview=true"                          >> "$GITHUB_OUTPUT"
            echo "tag=preview-$sha"                      >> "$GITHUB_OUTPUT"
            echo "name=Komet $version preview ($sha)"    >> "$GITHUB_OUTPUT"
            echo "draft=false"                           >> "$GITHUB_OUTPUT"
            echo "prerelease=true"                       >> "$GITHUB_OUTPUT"
          fi

      # A version is published once: bump modinfo.json to publish again.
      - name: Tag the commit
        id: tag
        run: |
          tag='${{ steps.what.outputs.tag }}'
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag exists already - not moving it, and not replacing its release"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "Komet $tag"
          git push origin "$tag"

      - name: Build the release notes
        if: steps.tag.outputs.publish == 'true'
        run: |
          {
            if [[ '${{ steps.what.outputs.preview }}' == 'true' ]]; then
              echo 'Preview build from `${{ github.ref_name }}`, commit `${{ github.sha }}`.'
              echo 'Not a release: it has passed the checks, nothing more.'
            else
              echo 'Built from `${{ github.sha }}`.'
            fi
            echo
            echo 'Check out `${{ steps.what.outputs.tag }}` and run `./build.sh` to rebuild it.'
            echo
            echo '```'
            cat dist/komet.sha256
            echo '```'
          } > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v3
        if: steps.tag.outputs.publish == 'true'
        with:
          tag_name: ${{ steps.what.outputs.tag }}
          name: ${{ steps.what.outputs.name }}
          body_path: notes.md
          draft: ${{ steps.what.outputs.draft }}
          prerelease: ${{ steps.what.outputs.prerelease }}
          # a preview must never displace the real release at the top of the tab
          make_latest: ${{ steps.what.outputs.preview == 'true' && 'false' || 'legacy' }}
          files: |
            dist/komet_*.zip
            dist/komet.sha256
          fail_on_unmatched_files: true

      # Keep the newest previews (by publish date); v* tags are never touched.
      - name: Prune old previews
        if: steps.what.outputs.preview == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: 3
        run: |
          gh release list --limit 200 --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | startswith("preview-"))]
                  | sort_by(.publishedAt) | reverse | .[].tagName' \
            | tail -n "+$((KEEP + 1))" \
            | while read -r tag; do
                [[ -n "$tag" ]] || continue
                echo "deleting $tag"
                gh release delete "$tag" --cleanup-tag --yes
              done
          echo "kept the newest $KEEP preview(s)"
